<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Capitán">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F172A'/%3E%3Cpath d='M50 25 L70 50 L50 75 L30 50 Z' fill='%23F59E0B'/%3E%3C/svg%3E">
<title>Capitán</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================
   DESIGN SYSTEM
   ===================================================== */
:root {
  /* Colores base — paleta sofisticada */
  --slate-50: #F8FAFC;
  --slate-100: #F1F5F9;
  --slate-200: #E2E8F0;
  --slate-300: #CBD5E1;
  --slate-400: #94A3B8;
  --slate-500: #64748B;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1E293B;
  --slate-900: #0F172A;
  --slate-950: #020617;

  /* Acentos */
  --amber-400: #FBBF24;
  --amber-500: #F59E0B;
  --amber-600: #D97706;
  --emerald-400: #34D399;
  --emerald-500: #10B981;
  --emerald-600: #059669;
  --rose-400: #FB7185;
  --rose-500: #F43F5E;
  --rose-600: #E11D48;
  --indigo-400: #818CF8;
  --indigo-500: #6366F1;
  --indigo-600: #4F46E5;
  --violet-500: #8B5CF6;
  --sky-500: #0EA5E9;

  /* Semánticos (tema claro por defecto) */
  --bg: var(--slate-50);
  --surface: #FFFFFF;
  --surface-2: var(--slate-100);
  --surface-3: var(--slate-200);
  --text-1: var(--slate-900);
  --text-2: var(--slate-600);
  --text-3: var(--slate-400);
  --border: var(--slate-200);
  --border-2: var(--slate-300);

  /* Primary brand */
  --brand: var(--slate-900);
  --brand-text: #FFFFFF;
  --accent: var(--amber-500);
  --accent-text: var(--slate-900);

  /* Estado */
  --success: var(--emerald-600);
  --success-bg: #ECFDF5;
  --success-text: #064E3B;
  --danger: var(--rose-600);
  --danger-bg: #FFF1F2;
  --danger-text: #881337;
  --warning-bg: #FEF3C7;
  --warning-text: #78350F;
  --info-bg: #EFF6FF;
  --info-text: #1E3A8A;

  /* Bloques del programa */
  --block-1-bg: #ECFDF5;
  --block-1-text: #065F46;
  --block-1-accent: var(--emerald-500);
  --block-2-bg: #FFFBEB;
  --block-2-text: #78350F;
  --block-2-accent: var(--amber-500);
  --block-3-bg: #FEF2F2;
  --block-3-text: #991B1B;
  --block-3-accent: var(--rose-500);

  /* Pasos (degradado conceptual) */
  --step-1: var(--emerald-500);
  --step-2: var(--sky-500);
  --step-3: var(--amber-500);
  --step-4: var(--slate-500);
  --step-5: var(--violet-500);
  --step-6: var(--rose-500);
  --step-7: var(--indigo-600);

  /* Espaciado (sistema 4px) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;

  /* Radius */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-2xl: 24px;
  --r-full: 9999px;

  /* Sombras */
  --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
  --shadow-2xl: 0 25px 50px -12px rgba(15, 23, 42, 0.2);

  /* Type */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Transitions */
  --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-slow: 400ms cubic-bezier(0.16, 1, 0.3, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--slate-950);
    --surface: var(--slate-900);
    --surface-2: var(--slate-800);
    --surface-3: var(--slate-700);
    --text-1: var(--slate-50);
    --text-2: var(--slate-400);
    --text-3: var(--slate-500);
    --border: var(--slate-800);
    --border-2: var(--slate-700);

    --brand: #FFFFFF;
    --brand-text: var(--slate-900);
    --accent: var(--amber-400);
    --accent-text: var(--slate-900);

    --success-bg: #064E3B;
    --success-text: #6EE7B7;
    --danger-bg: #4C0519;
    --danger-text: #FECDD3;
    --warning-bg: #451A03;
    --warning-text: #FDE68A;
    --info-bg: #172554;
    --info-text: #BFDBFE;

    --block-1-bg: #064E3B;
    --block-1-text: #A7F3D0;
    --block-2-bg: #451A03;
    --block-2-text: #FDE68A;
    --block-3-bg: #450A0A;
    --block-3-text: #FECACA;

    --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4), 0 1px 2px -1px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
  }
}

/* =====================================================
   RESET & BASE
   ===================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-1);
  font-size: 16px;
  line-height: 1.5;
  font-weight: 400;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: contain;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

button {
  font-family: inherit;
  font-size: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

input, textarea, select {
  font-family: inherit;
  font-size: 16px;
  color: var(--text-1);
}

/* =====================================================
   TYPOGRAPHY SYSTEM
   ===================================================== */
.t-display { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
.t-h1 { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
.t-h2 { font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.t-h3 { font-size: 17px; font-weight: 600; line-height: 1.35; }
.t-body { font-size: 15px; font-weight: 400; line-height: 1.55; }
.t-body-strong { font-size: 15px; font-weight: 500; line-height: 1.55; }
.t-small { font-size: 13px; font-weight: 400; line-height: 1.5; }
.t-tiny { font-size: 11px; font-weight: 500; line-height: 1.4; letter-spacing: 0.02em; }
.t-eyebrow {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-2);
}
.t-number { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-number-lg { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* =====================================================
   LAYOUT
   ===================================================== */
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 var(--s-4);
}

.stack { display: flex; flex-direction: column; gap: var(--s-3); }
.stack-2 { display: flex; flex-direction: column; gap: var(--s-2); }
.stack-4 { display: flex; flex-direction: column; gap: var(--s-4); }
.stack-6 { display: flex; flex-direction: column; gap: var(--s-6); }
.row { display: flex; align-items: center; gap: var(--s-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s-2); }
.flex-1 { flex: 1; min-width: 0; }
.text-center { text-align: center; }
.text-end { text-align: end; }
.gap-1 { gap: var(--s-1); }
.gap-2 { gap: var(--s-2); }
.gap-3 { gap: var(--s-3); }
.mb-1 { margin-bottom: var(--s-1); }
.mb-2 { margin-bottom: var(--s-2); }
.mb-3 { margin-bottom: var(--s-3); }
.mb-4 { margin-bottom: var(--s-4); }
.mt-1 { margin-top: var(--s-1); }
.mt-2 { margin-top: var(--s-2); }
.mt-3 { margin-top: var(--s-3); }
.mt-4 { margin-top: var(--s-4); }
.mt-6 { margin-top: var(--s-6); }
.p-3 { padding: var(--s-3); }
.p-4 { padding: var(--s-4); }
.text-1 { color: var(--text-1); }
.text-2 { color: var(--text-2); }
.text-3 { color: var(--text-3); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-accent { color: var(--accent); }
.hidden { display: none !important; }

/* =====================================================
   HEADER
   ===================================================== */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
@media (prefers-color-scheme: dark) {
  .header { background: rgba(15, 23, 42, 0.85); }
}
.header-inner {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-3) var(--s-4);
  min-height: 56px;
}
.header-content { flex: 1; min-width: 0; }
.header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.header-subtitle { font-size: 12px; color: var(--text-2); margin-top: 1px; }
.header-icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-1);
  transition: background var(--t-fast);
}
.header-icon-btn:hover { background: var(--surface-2); }
.header-icon-btn:active { background: var(--surface-3); }

/* Main */
main { padding: var(--s-4) 0 var(--s-8); }

/* =====================================================
   CARDS
   ===================================================== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--s-4);
  transition: border-color var(--t-base);
}
.card.elevated {
  border: none;
  box-shadow: var(--shadow-sm);
}
.card.glass {
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
}
.card.outline {
  background: transparent;
  border: 1px dashed var(--border-2);
}
.card.tappable {
  cursor: pointer;
  transition: transform var(--t-fast), border-color var(--t-fast), background var(--t-fast);
}
.card.tappable:active { transform: scale(0.98); background: var(--surface-2); }

.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-3); gap: var(--s-2); }
.card-title { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.04em; }

/* =====================================================
   HERO / WEEK PROGRESS
   ===================================================== */
.hero {
  background: var(--brand);
  color: var(--brand-text);
  border-radius: var(--r-xl);
  padding: var(--s-5);
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -20%;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  opacity: 0.15;
  pointer-events: none;
}
.hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); position: relative; }
.hero-week { font-size: 12px; font-weight: 600; opacity: 0.7; letter-spacing: 0.05em; text-transform: uppercase; }
.hero-date { font-size: 13px; opacity: 0.6; margin-top: 2px; text-transform: capitalize; }
.hero-block-badge {
  background: rgba(255, 255, 255, 0.12);
  padding: 4px 10px;
  border-radius: var(--r-full);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.hero-progress {
  margin-top: var(--s-4);
  position: relative;
  height: 6px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: var(--r-full);
  overflow: hidden;
}
.hero-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #FCD34D);
  border-radius: var(--r-full);
  transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1);
}
.hero-progress-label {
  margin-top: var(--s-2);
  font-size: 11px;
  opacity: 0.6;
  display: flex;
  justify-content: space-between;
}

/* =====================================================
   QUICK ADD
   ===================================================== */
.quick-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--s-4);
}
.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s-2);
  margin-top: var(--s-3);
}
.quick-btn {
  position: relative;
  background: var(--surface-2);
  border: 1.5px solid transparent;
  border-radius: var(--r-md);
  padding: var(--s-3) var(--s-2);
  text-align: left;
  transition: all var(--t-fast);
  min-height: 84px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}
.quick-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--step-color, var(--brand));
  opacity: 0.8;
}
.quick-btn:active {
  transform: scale(0.96);
  background: var(--surface-3);
}
.quick-btn.flash {
  animation: flashGreen 600ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes flashGreen {
  0% { background: var(--surface-2); }
  30% { background: var(--success); border-color: var(--success); color: white; transform: scale(1.04); }
  100% { background: var(--surface-2); transform: scale(1); }
}
.quick-btn-num {
  position: absolute;
  top: var(--s-2);
  right: var(--s-2);
  font-size: 11px;
  font-weight: 700;
  background: var(--surface);
  color: var(--text-1);
  padding: 2px 7px;
  border-radius: var(--r-full);
  border: 1px solid var(--border);
  min-width: 22px;
  text-align: center;
}
.quick-btn-num.has-value {
  background: var(--step-color, var(--brand));
  color: white;
  border-color: transparent;
}
.quick-btn-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  margin-top: auto;
}
.quick-btn-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  line-height: 1.25;
  margin-top: 2px;
}

/* =====================================================
   ACTION CARDS / BUTTONS
   ===================================================== */
.action-row { display: flex; gap: var(--s-2); }
.action-card {
  flex: 1;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: var(--s-3);
  text-align: left;
  transition: all var(--t-fast);
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
  min-height: 64px;
  justify-content: center;
}
.action-card:active { transform: scale(0.97); background: var(--surface-3); }
.action-card.primary {
  background: var(--brand);
  color: var(--brand-text);
}
.action-card.accent {
  background: var(--accent);
  color: var(--accent-text);
}
.action-card-icon { width: 18px; height: 18px; }
.action-card-title { font-size: 13px; font-weight: 600; }
.action-card-sub { font-size: 11px; opacity: 0.7; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: 0 var(--s-5);
  height: 48px;
  border-radius: var(--r-md);
  font-size: 15px;
  font-weight: 600;
  transition: all var(--t-fast);
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--brand);
  color: var(--brand-text);
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { background: var(--slate-800); }
@media (prefers-color-scheme: dark) {
  .btn-primary:hover { background: var(--slate-100); }
}
.btn-accent {
  background: var(--accent);
  color: var(--accent-text);
  box-shadow: var(--shadow-sm);
}
.btn-secondary {
  background: var(--surface);
  color: var(--text-1);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
.btn-ghost {
  background: transparent;
  color: var(--text-1);
}
.btn-ghost:hover { background: var(--surface-2); }
.btn-success {
  background: var(--success);
  color: white;
}
.btn-danger {
  background: var(--danger);
  color: white;
}
.btn-full { width: 100%; }
.btn-lg { height: 56px; font-size: 16px; }
.btn-sm { height: 36px; padding: 0 var(--s-3); font-size: 13px; }

/* =====================================================
   STATS GRID
   ===================================================== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--s-2);
}
.stat {
  background: var(--surface-2);
  padding: var(--s-3);
  border-radius: var(--r-md);
  position: relative;
  overflow: hidden;
}
.stat-label {
  font-size: 11px;
  color: var(--text-2);
  font-weight: 500;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.stat-meta {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}
.stat-meta.up { color: var(--success); }
.stat-meta.down { color: var(--danger); }

/* =====================================================
   INFO ICON
   ===================================================== */
.info-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12px;
  font-weight: 700;
  font-style: italic;
  transition: all var(--t-fast);
  flex-shrink: 0;
  border: 1px solid var(--border);
  font-family: Georgia, serif;
}
.info-icon:active {
  background: var(--brand);
  color: var(--brand-text);
  transform: scale(0.9);
}
.info-icon.on-dark {
  background: rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.9);
  border-color: rgba(255, 255, 255, 0.2);
}

/* =====================================================
   FORMS
   ===================================================== */
.field { margin-bottom: var(--s-4); }
.field-label {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: var(--s-2);
}
.input,
.textarea,
.select {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 15px;
  color: var(--text-1);
  transition: all var(--t-fast);
  font-family: inherit;
}
.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--brand);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
}
@media (prefers-color-scheme: dark) {
  .input:focus, .textarea:focus, .select:focus {
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
  }
}
.textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--text-3); }

/* Sliders */
.slider-wrap {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-4);
}
.slider-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--s-3);
  gap: var(--s-2);
}
.slider-title {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-size: 14px;
  font-weight: 600;
  flex: 1;
  min-width: 0;
}
.slider-value {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  min-width: 44px;
  text-align: right;
  letter-spacing: -0.02em;
}
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  background: var(--surface-3);
  border-radius: var(--r-full);
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  border-radius: var(--r-full);
  background: var(--brand);
  border: 3px solid var(--surface);
  box-shadow: var(--shadow-md);
  cursor: pointer;
  transition: transform var(--t-fast);
}
input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
input[type=range]::-moz-range-thumb {
  width: 28px;
  height: 28px;
  border-radius: var(--r-full);
  background: var(--brand);
  border: 3px solid var(--surface);
  cursor: pointer;
}
.slider-ticks {
  display: flex;
  justify-content: space-between;
  margin-top: var(--s-2);
  font-size: 11px;
  color: var(--text-3);
}

/* =====================================================
   TOAST / NOTIFICATION
   ===================================================== */
.toast {
  position: fixed;
  bottom: 100px;
  bottom: calc(100px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(150%);
  background: var(--slate-900);
  color: white;
  padding: 12px 18px;
  border-radius: var(--r-full);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-xl);
  z-index: 1000;
  transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  white-space: nowrap;
  max-width: 90%;
}
@media (prefers-color-scheme: dark) {
  .toast { background: var(--slate-100); color: var(--slate-900); }
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); color: white; }
.toast-icon { font-size: 16px; }

/* =====================================================
   MODAL / BOTTOM SHEET
   ===================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 999;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn var(--t-base);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface);
  width: 100%;
  max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  padding: var(--s-5);
  padding-bottom: calc(var(--s-5) + env(safe-area-inset-bottom));
  animation: slideUp var(--t-slow);
  position: relative;
}
.modal::before {
  content: "";
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 4px;
  background: var(--border-2);
  border-radius: var(--r-full);
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--s-4);
  margin-top: var(--s-3);
  gap: var(--s-2);
}
.modal-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: var(--r-full);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  flex-shrink: 0;
}

/* Info sections in modals */
.info-block { margin-bottom: var(--s-4); }
.info-block-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.info-block-text { font-size: 14px; line-height: 1.6; color: var(--text-1); }
.info-block-text.highlight {
  background: var(--warning-bg);
  color: var(--warning-text);
  padding: var(--s-3);
  border-radius: var(--r-md);
  font-weight: 500;
}
.example-list {
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: var(--s-3);
}
.example-item {
  font-size: 13px;
  padding: 4px 0;
  color: var(--text-1);
  display: flex;
  gap: var(--s-2);
  align-items: flex-start;
}
.example-item::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: var(--r-full);
  margin-top: 8px;
  flex-shrink: 0;
}

/* =====================================================
   GLOSSARY
   ===================================================== */
.glossary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  transition: all var(--t-fast);
}
.glossary-card.open { box-shadow: var(--shadow-md); }
.glossary-header {
  padding: var(--s-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  cursor: pointer;
  transition: background var(--t-fast);
}
.glossary-header:active { background: var(--surface-2); }
.glossary-num {
  width: 32px;
  height: 32px;
  border-radius: var(--r-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.glossary-num.step-1 { background: var(--step-1); }
.glossary-num.step-2 { background: var(--step-2); }
.glossary-num.step-3 { background: var(--step-3); }
.glossary-num.step-4 { background: var(--step-4); }
.glossary-num.step-5 { background: var(--step-5); }
.glossary-num.step-6 { background: var(--step-6); }
.glossary-num.step-7 { background: var(--step-7); }
.glossary-num.concept {
  background: var(--surface-2);
  color: var(--text-1);
  font-size: 11px;
  border: 1px solid var(--border);
}
.glossary-title { font-size: 15px; font-weight: 600; flex: 1; }
.glossary-arrow {
  color: var(--text-3);
  transition: transform var(--t-base);
}
.glossary-card.open .glossary-arrow { transform: rotate(180deg); }
.glossary-body {
  padding: 0 var(--s-4) var(--s-4);
  display: none;
  border-top: 1px solid var(--border);
  padding-top: var(--s-4);
}
.glossary-card.open .glossary-body { display: block; }

/* =====================================================
   ENTRY CARDS (history items)
   ===================================================== */
.entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-3) var(--s-4);
  cursor: pointer;
  transition: all var(--t-fast);
}
.entry:active { transform: scale(0.99); background: var(--surface-2); }
.entry-meta {
  font-size: 11px;
  color: var(--text-2);
  font-weight: 500;
  margin-bottom: 4px;
  display: flex;
  gap: var(--s-2);
  align-items: center;
}
.entry-title { font-size: 14px; font-weight: 600; color: var(--text-1); line-height: 1.4; }
.entry-body { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
.entry-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.entry-tag.success { background: var(--success-bg); color: var(--success-text); }
.entry-tag.danger { background: var(--danger-bg); color: var(--danger-text); }
.entry-tag.neutral { background: var(--surface-2); color: var(--text-2); }

.entry-stats {
  display: flex;
  gap: var(--s-3);
  margin-top: var(--s-2);
  flex-wrap: wrap;
}
.entry-stat {
  font-size: 11px;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
}

/* =====================================================
   DAY TILES (week view)
   ===================================================== */
.day-tile {
  display: flex;
  align-items: flex-start;
  gap: var(--s-3);
  padding: var(--s-3);
  background: var(--surface-2);
  border-radius: var(--r-md);
  transition: all var(--t-fast);
}
.day-tile.done { background: var(--success-bg); }
.day-tile.done .day-tasks { opacity: 0.65; }
.day-check {
  width: 26px;
  height: 26px;
  border-radius: var(--r-full);
  border: 2px solid var(--border-2);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  color: white;
  transition: all var(--t-fast);
}
.day-check.checked { background: var(--success); border-color: var(--success); }
.day-check:active { transform: scale(0.9); }
.day-name {
  font-size: 13px;
  font-weight: 700;
  min-width: 32px;
  color: var(--text-1);
  padding-top: 4px;
}
.day-tasks {
  flex: 1;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
}

/* =====================================================
   NOTICES
   ===================================================== */
.notice {
  border-radius: var(--r-md);
  padding: var(--s-3) var(--s-4);
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  gap: var(--s-3);
  align-items: flex-start;
}
.notice strong { font-weight: 600; }
.notice-warning { background: var(--warning-bg); color: var(--warning-text); }
.notice-danger { background: var(--danger-bg); color: var(--danger-text); }
.notice-success { background: var(--success-bg); color: var(--success-text); }
.notice-info { background: var(--info-bg); color: var(--info-text); }
.notice-icon { font-size: 16px; flex-shrink: 0; line-height: 1.5; }

/* =====================================================
   BLOCK BADGE
   ===================================================== */
.block-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-full);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.block-pill.b1 { background: var(--block-1-bg); color: var(--block-1-text); }
.block-pill.b2 { background: var(--block-2-bg); color: var(--block-2-text); }
.block-pill.b3 { background: var(--block-3-bg); color: var(--block-3-text); }
.block-dot { width: 6px; height: 6px; border-radius: var(--r-full); }
.block-pill.b1 .block-dot { background: var(--block-1-accent); }
.block-pill.b2 .block-dot { background: var(--block-2-accent); }
.block-pill.b3 .block-dot { background: var(--block-3-accent); }

/* =====================================================
   TAB BAR
   ===================================================== */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border);
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark) {

}
.tab-inner {
  display: flex;
  max-width: 600px;
  margin: 0 auto;
  padding: 6px;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px;
  color: var(--text-3);
  border-radius: var(--r-md);
  font-size: 10px;
  font-weight: 500;
  transition: color var(--t-fast);
  position: relative;
}
.tab-btn.active { color: var(--text-1); }
.tab-btn.active .tab-icon { color: var(--accent); }
.tab-btn:active { background: var(--surface-2); }
.tab-icon { width: 22px; height: 22px; transition: color var(--t-fast); }

/* =====================================================
   FAB
   ===================================================== */
.fab {
  position: fixed;
  bottom: calc(86px + env(safe-area-inset-bottom));
  right: var(--s-4);
  width: 56px;
  height: 56px;
  border-radius: var(--r-full);
  background: var(--brand);
  color: var(--brand-text);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-xl);
  z-index: 40;
  transition: transform var(--t-fast);
}
.fab:active { transform: scale(0.92); }

/* =====================================================
   EMPTY STATES
   ===================================================== */
.empty {
  padding: var(--s-12) var(--s-4);
  text-align: center;
}
.empty-icon {
  width: 64px;
  height: 64px;
  border-radius: var(--r-full);
  background: var(--surface-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--s-4);
  color: var(--text-3);
}
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-1); margin-bottom: var(--s-2); }
.empty-text { font-size: 13px; color: var(--text-2); max-width: 280px; margin: 0 auto var(--s-4); line-height: 1.5; }

/* =====================================================
   ONBOARDING
   ===================================================== */
.onboard {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: var(--s-6) var(--s-4);
}
.onboard-icon {
  width: 80px;
  height: 80px;
  border-radius: var(--r-2xl);
  background: var(--brand);
  color: var(--brand-text);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--s-6);
  box-shadow: var(--shadow-xl);
  position: relative;
  overflow: hidden;
}
.onboard-icon::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, var(--accent) 0%, transparent 60%);
  opacity: 0.5;
}
.onboard-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: var(--s-3); }
.onboard-text { font-size: 15px; color: var(--text-2); line-height: 1.6; max-width: 320px; margin-bottom: var(--s-6); }

/* =====================================================
   ICON COMPONENT (SVG via use)
   ===================================================== */
.icon { width: 1em; height: 1em; vertical-align: -0.15em; fill: currentColor; flex-shrink: 0; }

/* =====================================================
   UTILS
   ===================================================== */
hr.divider { border: none; border-top: 1px solid var(--border); margin: var(--s-4) 0; }
.skeleton {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--r-md);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

// STORAGE
// =====================================================
const STORAGE_KEY = "capitan_app_data_v3";
const DEFAULT_DATA = {
  startDate: null,
  registros: {},
  interacciones: [],
  pinceladas: [],
  victorias: [],
  semanasRevision: {},
  semanasDias: {},
  bloquesEval: {},
  terapiaSesiones: [],
  terapiaNotas: []
};

function loadData() {
  try {
    // Migrate from v2
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) raw = localStorage.getItem("capitan_app_data_v2");
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    return Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    toast("Error al guardar");
    return false;
  }
}

let DATA = loadData();
let CURRENT_VIEW = "home";
let VIEW_STACK = [];
let CURRENT_PARAMS = {};

// =====================================================
// UTILS
// =====================================================
function toast(msg, type = "default") {
  const el = document.getElementById("toast");
  el.innerHTML = type === "success"
    ? `<svg class="icon" style="font-size:14px"><use href="#i-check"/></svg>${msg}`
    : msg;
  el.className = "toast show" + (type === "success" ? " success" : "");
  setTimeout(() => el.classList.remove("show"), 2000);

  // Haptic feedback if available
  if (navigator.vibrate) navigator.vibrate(10);
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function formatDate(s) {
  return new Date(s).toLocaleDateString("es-ES", {day:"2-digit", month:"short"});
}

function formatDateFull(s) {
  return new Date(s).toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
}

function capFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function getCurrentWeek() {
  if (!DATA.startDate) return null;
  const start = new Date(DATA.startDate);
  const now = new Date();
  const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return 0;
  return Math.min(Math.floor(diffDays / 7) + 1, 12);
}

function getCurrentBlock() {
  const week = getCurrentWeek();
  if (!week) return null;
  if (week <= 4) return 1;
  if (week <= 8) return 2;
  return 3;
}

function getStartOfWeek() {
  const date = new Date();
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(date.setDate(diff));
}

function isThisWeek(dateStr) {
  const d = new Date(dateStr);
  const start = getStartOfWeek();
  start.setHours(0, 0, 0, 0);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return d >= start && d < end;
}

function sumStep(stepKey) {
  let total = 0, thisWeek = 0;
  Object.entries(DATA.registros).forEach(([date, reg]) => {
    const val = parseFloat(reg[stepKey]) || 0;
    total += val;
    if (isThisWeek(date)) thisWeek += val;
  });
  return { total, thisWeek };
}

function todayReg() {
  return DATA.registros[todayKey()] || {};
}

function ensureTodayReg() {
  const t = todayKey();
  if (!DATA.registros[t]) DATA.registros[t] = {};
  return DATA.registros[t];
}

function daysSinceLastRegister() {
  const dates = Object.keys(DATA.registros).filter(d => {
    const reg = DATA.registros[d];
    return Object.values(reg).some(v => v && v !== 0 && v !== "");
  }).sort();
  if (dates.length === 0) return null;
  const last = new Date(dates[dates.length - 1]);
  const today = new Date(todayKey());
  return Math.floor((today - last) / (1000 * 60 * 60 * 24));
}

// =====================================================
// NAVIGATION
// =====================================================
function navigate(view, params = {}, push = true) {
  if (push && CURRENT_VIEW !== view) VIEW_STACK.push({view: CURRENT_VIEW, params: CURRENT_PARAMS});
  CURRENT_VIEW = view;
  CURRENT_PARAMS = params;
  render();
  window.scrollTo(0, 0);
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });
  const showBack = VIEW_STACK.length > 0 && !["home", "glossary", "weeks", "therapy", "more"].includes(view);
  document.getElementById("backBtn").classList.toggle("hidden", !showBack);
  document.getElementById("headerInfoBtn").classList.add("hidden");
}

function goBack() {
  if (VIEW_STACK.length === 0) return navigate("home", {}, false);
  const prev = VIEW_STACK.pop();
  navigate(prev.view, prev.params, false);
}

  document.getElementById("modalTitle").textContent = title;

}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

function showInfo(key) {
  const i = INFO[key];
  if (!i) return;
  let body = '';
  if (i.que) body += `<div class="info-block"><div class="info-block-label">Qué es</div><div class="info-block-text">${i.que}</div></div>`;
  if (i.como) body += `<div class="info-block"><div class="info-block-label">Escala</div><div class="info-block-text">${i.como}</div></div>`;
  if (i.porque) body += `<div class="info-block"><div class="info-block-label">Por qué se mide</div><div class="info-block-text">${i.porque}</div></div>`;
  if (i.util) body += `<div class="info-block"><div class="info-block-label">Para qué sirve</div><div class="info-block-text highlight">${i.util}</div></div>`;
  openModal(i.titulo, body);
}

function showConceptInfo(key) {
  const c = CONCEPTOS.find(x => x.key === key);

  const body = `
    <div class="info-block"><div class="info-block-label">Qué es</div><div class="info-block-text">${c.que}</div></div>

  if (btn) {

}

function saveInteraccion() {
  const i = {
    fecha: document.getElementById("i-fecha").value,
    paso: document.getElementById("i-paso").value,
    contexto: document.getElementById("i-contexto").value,
    persona: document.getElementById("i-persona").value,
    activacion: parseInt(document.getElementById("slider-i-activacion").value),
    pinceladas: parseInt(document.getElementById("i-pinceladas").value) || 0,
    actue: document.getElementById("i-actue").value,
    resumen: document.getElementById("i-resumen").value,
    aprendizaje: document.getElementById("i-aprendizaje").value,
    timestamp: Date.now()
  };
  if (!i.paso) { toast("Elige qué paso fue"); return; }
  DATA.interacciones.push(i);
  if (i.paso !== "otro" && i.paso) {
    const reg = ensureTodayReg();
    reg[i.paso] = (reg[i.paso] || 0) + 1;
  }
  if (i.pinceladas > 0) {
    for (let n = 0; n < i.pinceladas; n++) {
      DATA.pinceladas.push({
        fecha: i.fecha, persona: i.persona, contexto: i.contexto,
        pincelada: i.resumen.slice(0, 100),
        accion: i.actue === "Sí" ? "Sí" : "No",
        notas: "Auto-registrada desde interacción"
      });
    }
  }
  saveData(DATA);
  toast("Interacción guardada", "success");
  setTimeout(() => navigate("home", {}, false), 600);
}

  if (!DATA.bloquesEval[key]) DATA.bloquesEval[key] = {};
  if (!DATA.bloquesEval[key][idx]) DATA.bloquesEval[key][idx] = {};
  DATA.bloquesEval[key][idx][field] = val;
  saveData(DATA);
}

function saveStartDate() {
  DATA.startDate = document.getElementById("startDate").value;
  saveData(DATA);
  toast("Fecha guardada", "success");
  setTimeout(() => navigate("home", {}, false), 600);
}

function exportData() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `capitan-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Backup descargado", "success");
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!confirm("¿Reemplazar todos los datos con el backup importado?")) return;
      DATA = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), imported);
      saveData(DATA);
      toast("Datos importados", "success");
      setTimeout(() => navigate("home", {}, false), 600);
    } catch (err) {
      toast("Error: archivo inválido");
    }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm("¿Borrar TODOS los datos? No se puede deshacer.")) return;
  if (!confirm("Última confirmación. ¿Borrar todo?")) return;
  DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData(DATA);
  toast("Datos borrados", "success");
  setTimeout(() => navigate("home", {}, false), 600);
}
